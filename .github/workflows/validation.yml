name: Comeback validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: comeback-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  base-trust-anchor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: contracts
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.7.1
          cache: false

      - name: Check formatting
        run: forge fmt --check

      - name: Build and test trust anchor
        run: |
          forge build --sizes
          forge test -vvv

  fresh-session-memory-gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    # The Windows job intentionally executes the complete suite twice (directly
    # and through release_check.py), followed by replay and shell-launcher gates.
    # Both suites can exceed the former combined 10-minute cap as coverage grows.
    # Keep every check and the repeat run; increase only the scheduling budget.
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: python -m pip install -e '.[dev]'

      # Separate native commands: PowerShell otherwise reports only the last
      # exit code, potentially hiding a failed first suite behind a later pass.
      - name: Compile
        run: python -m compileall -q src tests scripts

      - name: Unit tests
        run: python -m pytest -q

      - name: Release check
        run: python scripts/release_check.py

      - name: Replay fresh-session Sibyl gate
        run: python scripts/run_validation_gate.py > comeback-validation.json

      - name: Execute installed hooks through their real platform shells
        shell: bash
        run: python scripts/run_installed_hook_gate.py > comeback-installed-hook.json

      - name: Upload replay artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: comeback-validation-${{ matrix.os }}-py${{ matrix.python }}-${{ github.sha }}
          path: |
            comeback-validation.json
            comeback-installed-hook.json
          if-no-files-found: error
          retention-days: 30
