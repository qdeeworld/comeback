name: Comeback validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: comeback-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fresh-session-memory-gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Compile and test
        run: |
          python -m compileall -q src tests scripts
          python -m pytest -q
          python scripts/release_check.py

      - name: Replay fresh-session Sibyl gate
        run: python scripts/run_validation_gate.py > comeback-validation.json

      - name: Execute installed hooks through Bash
        shell: bash
        run: python scripts/run_installed_hook_gate.py > comeback-installed-hook.json

      - name: Upload replay artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: comeback-validation-${{ matrix.os }}-${{ github.sha }}
          path: |
            comeback-validation.json
            comeback-installed-hook.json
          if-no-files-found: error
          retention-days: 30
