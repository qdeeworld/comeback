[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "comeback-agent"
version = "0.1.0"
description = "Adaptive coding-agent supervision backed by Sibyl Memory"
requires-python = ">=3.10"
dependencies = [
  "eth-account>=0.13,<0.14",
  "sibyl-memory-client==0.8.0",
  "tomli>=2,<3; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pyyaml>=6,<7"]

[project.scripts]
comeback = "comeback.cli:main"
comeback-hook = "comeback.hook:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
comeback = ["assets/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
